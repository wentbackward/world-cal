# Deploy World-Cal
#
# Triggers:
#   - Push to a STABLE tag matching ^v[0-9]+\.[0-9]+\.[0-9]+$ — FULL pipeline
#     (unit tests → version gate → Docker build + GHCR publish → SSH deploy).
#   - workflow_dispatch — operator escape hatch — FULL pipeline, runs as a
#     deploy of the current HEAD with no tag; the version gate is skipped
#     because there is no tag to check. Use only when the automated gate is
#     blocked (e.g. redeploy of an already-built artifact).
#   - Push to main, pull request, or a CANDIDATE tag (does not match the
#     semver pattern) — lightweight unit-test gate only (lint + unit tests).
#     No build, no publish, no deploy.

name: Deploy World-Cal

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

env:
  IMAGE_TAG: ghcr.io/wentbackward/world-cal

jobs:
  # ── Stage 1: Unit Tests (lightweight gate — runs on every trigger) ──
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --run

  # ── Stage 2: Version Gate ────────────────────────────────────────
  # Runs on every trigger (so the workflow_dispatch escape hatch's
  # needs-chain is not skipped). The script no-ops non-tag refs: any
  # ref that does not match the semver pattern reports ok=false (never
  # fails the run). Tag pushes that disagree with package.json version
  # exit 1 — refusing the build. The build job's own `if:` distinguishes
  # workflow_dispatch (run) from tag pushes (run only when ok=true).
  version-check:
    name: Version Check
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches package.json version
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Candidate tag '$TAG' does not match ^v[0-9]+\.[0-9]+\.[0-9]+$ — running the unit-test gate only; no build, no publish, no deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error::Tag '$TAG' disagrees with package.json version 'v$PKG_VERSION' — refusing the pipeline"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' matches package.json version — full pipeline will run"

  # ── Stage 3: Build & Publish Docker Image (full pipeline) ────────
  build:
    name: Build & Publish
    needs: [test, version-check]
    if: >-
      needs.test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.version-check.outputs.ok == 'true'))
    runs-on: ubuntu-latest
    # The automatic GITHUB_TOKEN publishes to GHCR — no custom token
    # secret. Requires the repo (and thus the package) to be public;
    # a private package would reject the push and the VPS's anonymous
    # pull.
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-depth: 0 — vite.config.ts reads the most recent tag to stamp
      # the release date in the build (untagged/shallow builds omit it).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR (automatic token)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}:latest
            ${{ env.IMAGE_TAG }}:${{ github.sha }}

  # ── Stage 4: Deploy to VPS (full pipeline) ───────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGE_TAG="${{ env.IMAGE_TAG }}:${{ github.sha }}"

            # Create network if needed (match infra docker-compose network)
            docker network create infra_app-net 2>/dev/null || true

            # Pull image — ANONYMOUS: the package is public, so no
            # docker login on the VPS (escape hatch if we ever hit the
            # GHCR anonymous rate limit: a one-time `docker login
            # ghcr.io` with a read-only token, stored on the VPS).
            echo "Pulling image ${IMAGE_TAG}..."
            docker pull ${IMAGE_TAG}

            # Stop/remove existing container
            docker stop world-cal 2>/dev/null || true
            docker rm world-cal 2>/dev/null || true

            # Start new container on the same network as Caddy
            echo "Starting world-cal container..."
            docker run -d \
              --name world-cal \
              --network infra_app-net \
              --restart unless-stopped \
              -e GIT_SHA=${{ github.sha }} \
              ${IMAGE_TAG}

            # Wait for health
            TIMEOUT=30
            ELAPSED=0
            until curl -sf http://localhost:80/ > /dev/null 2>&1; do
              if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
                echo "Error: Container did not become healthy within ${TIMEOUT}s."
                docker logs world-cal
                exit 1
              fi
              sleep 2
              ELAPSED=$((ELAPSED + 2))
            done

            # Clean up old images
            docker image prune -f

            echo "✅ world-cal deployed successfully (SHA: ${{ github.sha }})"
